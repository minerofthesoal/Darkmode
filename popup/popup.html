<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OLED Dark Mode</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <!-- Header -->
    <header>
      <div class="header-left">
        <h1>OLED Dark Mode</h1>
        <span class="version">v3</span>
      </div>
      <label class="switch" for="globalToggle">
        <input type="checkbox" id="globalToggle">
        <span class="slider"></span>
      </label>
    </header>

    <!-- Current site -->
    <section class="site-section">
      <div class="site-info">
        <span class="site-label" id="siteLabel">--</span>
        <span class="mode-badge" id="modeBadge">blacklist</span>
      </div>
      <div class="site-actions">
        <button class="btn btn-sm" id="tabToggle" title="Toggle this tab only">Tab</button>
        <button class="btn btn-sm" id="siteToggle">Exclude site</button>
      </div>
    </section>

    <!-- Theme presets -->
    <section class="controls">
      <div class="section-title">Theme</div>
      <div class="theme-row" id="themeRow">
        <button class="theme-btn active" data-theme="oled" title="Pure Black">
          <span class="swatch" style="background:#000"></span> OLED
        </button>
        <button class="theme-btn" data-theme="dark" title="Dark Gray">
          <span class="swatch" style="background:#1a1a1a"></span> Dark
        </button>
        <button class="theme-btn" data-theme="midnight" title="Midnight Blue">
          <span class="swatch" style="background:#0a0a2e"></span> Night
        </button>
      </div>
      <div class="theme-row theme-row-2" id="themeRow2">
        <button class="theme-btn" data-theme="charcoal" title="Charcoal">
          <span class="swatch" style="background:#222"></span> Coal
        </button>
        <button class="theme-btn" data-theme="nord" title="Nord">
          <span class="swatch" style="background:#2e3440"></span> Nord
        </button>
        <button class="theme-btn" data-theme="solarized" title="Solarized Dark">
          <span class="swatch" style="background:#002b36"></span> Solar
        </button>
      </div>
    </section>

    <!-- Adjustments -->
    <section class="controls">
      <div class="section-title">Adjustments</div>
      <div class="control-row">
        <label for="brightness">Brightness</label>
        <input type="range" id="brightness" min="50" max="150" value="100">
        <span class="val" id="brightnessVal">100%</span>
      </div>
      <div class="control-row">
        <label for="contrast">Contrast</label>
        <input type="range" id="contrast" min="50" max="150" value="100">
        <span class="val" id="contrastVal">100%</span>
      </div>
      <div class="control-row">
        <label for="sepia">Sepia</label>
        <input type="range" id="sepia" min="0" max="100" value="0">
        <span class="val" id="sepiaVal">0%</span>
      </div>
      <div class="control-row">
        <label for="grayscale">Grayscale</label>
        <input type="range" id="grayscale" min="0" max="100" value="0">
        <span class="val" id="grayscaleVal">0%</span>
      </div>
    </section>

    <!-- Images -->
    <section class="controls">
      <div class="control-row toggle-row">
        <label for="dimImages">Dim images</label>
        <label class="switch small" for="dimImages">
          <input type="checkbox" id="dimImages">
          <span class="slider"></span>
        </label>
      </div>
      <div class="control-row" id="opacityRow" style="display:none">
        <label for="imageOpacity">Opacity</label>
        <input type="range" id="imageOpacity" min="30" max="100" value="90">
        <span class="val" id="imageOpacityVal">90%</span>
      </div>
    </section>

    <!-- Text readability -->
    <section class="controls">
      <div class="control-row toggle-row">
        <label for="textReadability">Text readability</label>
        <label class="switch small" for="textReadability">
          <input type="checkbox" id="textReadability">
          <span class="slider"></span>
        </label>
      </div>
    </section>

    <!-- Per-site override -->
    <section class="controls">
      <div class="control-row toggle-row">
        <label for="perSiteToggle">Per-site settings</label>
        <label class="switch small" for="perSiteToggle">
          <input type="checkbox" id="perSiteToggle">
          <span class="slider"></span>
        </label>
      </div>
      <div id="perSiteInfo" class="per-site-info" style="display:none">
        <span class="help-text">Adjustments above saved for this site only.</span>
        <button class="btn btn-xs" id="clearOverride">Clear</button>
      </div>
    </section>

    <!-- Footer -->
    <footer>
      <button class="btn btn-sm" id="resetBtn">Reset</button>
      <a href="#" id="optionsLink">Settings</a>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
